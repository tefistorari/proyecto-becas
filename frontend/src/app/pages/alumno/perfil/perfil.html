@if (cargando()) {
    <p>Cargando...</p>
} @else {
    <form [formGroup] = "form" (ngSubmit)="guardar()">

        <h2>{{ modo() === 'crear' ? 'Completar mis datos' : 'Mis datos' }}</h2>

        <div class="campo">
            <label for="dni">DNI</label>
            <input type="text" id="dni" formControlName="dni">
        </div>

        <div class="campo">
            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input type="date" id="fechaNacimiento" formControlName="fechaNacimiento">
        </div>

        <div class="campo">
            <label for="genero">Género</label>
            <select id="genero" formControlName="genero">
                <option value="" disabled selected>Seleccioná</option>
                <option value="MASCULINO">Masculino</option>
                <option value="FEMENINO">Femenino</option>
                <option value="OTRO">Otro</option>
            </select>
        </div>

        <div class="campo">
            <label for="celular">Celular</label>
            <input type="text" id="celular" formControlName="celular">
        </div>

        <div class="campo">
            <label for="domicilioCalle">Calle</label>
            <input type="text" id="domicilioCalle" formControlName="domicilioCalle">
        </div>

        <div class="campo">
            <label for="domicilioNumero">Número</label>
            <input type="number" id="domicilioNumero" formControlName="domicilioNumero">
        </div>

        <div class="campo">
            <label for="domicilioPisoDepto">Piso/Depto</label>
            <input type="text" id="domicilioPisoDepto" formControlName="domicilioPisoDepto">
        </div>

        <div class="campo">
            <label for="codigoPostal">Código postal</label>
            <input type="text" id="codigoPostal" formControlName="codigoPostal">
        </div>

        <div class="campo">
            <label for="nacionalidad">Nacionalidad</label>
            <select id="nacionalidad" formControlName="nacionalidad">
                <option value="" disabled selected>Seleccioná una provincia</option>
                @for (nacionalidad of nacionalidades(); track nacionalidad.iso2) {
                    <option [value]="nacionalidad.iso2"> {{nacionalidad.name}} </option>
                }
            </select>
        </div>

        <div class="campo">
            <label for="provincia">Provincia</label>
            <select id="provincia" formControlName="provincia" (change)="cargarLocalidades($any($event.target).value)">
                <option value="" disabled selected>Seleccioná una provincia</option>
                @for (provincia of provincias(); track provincia.iso2) {
                    <option [value]="provincia.iso2"> {{provincia.name}} </option>
                }
            </select>
        </div>

        <div class="campo">
            <label for="localidad">Localidad</label>
            <select id="localidad" formControlName="localidad">
                <option value="" disabled selected>Seleccioná una localidad</option>
                @for (localidad of localidades(); track localidad.iso2) {
                    <option [value]="localidad.id"> {{localidad.name}} </option>
                }
            </select>
        </div>

        <div class="campo">
            <label for="domicilioFamiliarDistinto">
                <input type="checkbox" id="domicilioFamiliarDistinto" formControlName="domicilioFamiliarDistinto">
                El domicilio familiar es distinto
            </label>
        </div>

        @if (form.value.domicilioFamiliarDistinto) {
            <div class="campo">
                <label for="domicilioFamiliarCalle">Calle (familiar)</label>
                <input type="text" id="domicilioFamiliarCalle" formControlName="domicilioFamiliarCalle">
            </div>

            <div class="campo">
                <label for="domicilioFamiliarNumero">Numero (familiar)</label>
                <input type="number" id="domicilioFamiliarNumero" formControlName="domicilioFamiliarNumero">
            </div>

            <div class="campo">
                <label for="domicilioFamiliarPisoDepto">Piso/Depto (familiar)</label>
                <input type="text" id="domicilioFamiliarPisoDepto" formControlName="domicilioFamiliarPisoDepto">
            </div>

            <div class="campo">
                <label for="domicilioFamiliarCodigoPostal">Código postal (familiar)</label>
                <input type="text" id="domicilioFamiliarCodigoPostal" formControlName="domicilioFamiliarCodigoPostal">
            </div>

            <div class="campo">
                <label for="domicilioFamiliarProvincia">Provincia (familiar)</label>
                <select id="domicilioFamiliarProvincia" formControlName="domicilioFamiliarProvincia" (change)="cargarLocalidadesFamiliar($any($event.target).value)">
                    <option value="" disabled selected>Seleccioná una provincia</option>
                    @for (provincia of provinciasFamiliar(); track provincia.iso2) {
                        <option [value]="provincia.iso2"> {{provincia.name}} </option>
                    }
                </select>
            </div>

            <div class="campo">
                <label for="domicilioFamiliarLocalidad">Localidad (familiar)</label>
                <select id="domicilioFamiliarLocalidad" formControlName="domicilioFamiliarLocalidad">
                    <option value="" disabled selected>Seleccioná una localidad</option>
                    @for (localidad of localidadesFamiliar(); track localidad.iso2) {
                        <option [value]="localidad.id">{{ localidad.name }}</option>
                    }
                </select>
            </div>
        }
        
        <button type="submit" [disabled]="guardando()">
            {{ guardando() ? 'Guardando...' : (modo() === 'crear' ? 'Crear' : 'Actualizar') }}
        </button>

    </form>
}
